# nexc-engine with Docker Compose.
#
#   make init              # creates .env with generated secrets (demo LLM provider by default)
#   docker compose up -d --build
#   open http://localhost:8080        # or https://localhost:8443: HTTP/2 and HTTP/3
#
# Only the web UI is published. The backend, the agent runtime and PostgreSQL live on internal
# networks; the runtime reaches the internet only through runtime-egress, for the LLM endpoints
# of NEXC_RUNTIME_EGRESS_ALLOW. Optional texc-symphony executor: `docker compose --profile symphony up -d`.
#
# Two backend replicas (docs/HA.md), so a run survives the loss of the one executing it: set
# NEXC_BACKEND_REPLICAS=2 in .env, so every later `docker compose up -d` keeps both, then
#
#   docker compose up -d
#   docker compose restart frontend     # its nginx resolves every backend replica when it starts
#
# The replicas share PostgreSQL and the nexc-data volume. A run executes on one of them; when
# that one stops (a crash, `docker stop nexc-backend-1`, an upgrade), the other takes the run
# over: at once after a clean stop, which hands runs over, or once the lease ran out after a crash
# (NEXC_RUN_LEASE_SECS, 30 s by default, plus a few seconds). `docker compose stop backend` stops
# every replica. Restart frontend again whenever the number of replicas changes.

name: nexc

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    # Run as the image's postgres user (uid 70) so no capabilities are needed at all.
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is empty - run `make init`}
      POSTGRES_DB: ${POSTGRES_DB:-nexc}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775
      - /tmp:uid=70,gid=70,mode=1777
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]

  backend:
    <<: *hardening
    # How many backend replicas run (docs/HA.md); 2 or more keep runs going when one stops.
    scale: ${NEXC_BACKEND_REPLICAS:-1}
    image: ghcr.io/f8fvwgzc/nexc-engine-backend:${NEXC_IMAGE_TAG:-latest}
    pull_policy: missing # local image, else pull the release, else build from source
    build:
      context: ./backend
    env_file: [.env]
    environment:
      # Container networking overrides the local-dev values in .env.
      NEXC_HOST: 0.0.0.0
      NEXC_PORT: "8080"
      NEXC_DATA_DIR: /data
      NEXC_DATABASE_URL: postgres://${POSTGRES_USER:-nexc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexc}
      NEXC_RUNTIME_URL: http://agent-runtime:8090
      # The gRPC stream to the runtime (the default wire); NDJSON stays available for one release.
      NEXC_RUNTIME_PROTOCOL: ${NEXC_RUNTIME_PROTOCOL:-grpc}
      NEXC_RUNTIME_GRPC_URL: http://agent-runtime:8095
      # HTTP/2 keepalive of the gRPC channels (runtime, onto-intelli, OTLP collector) and of the
      # Agent Firewall server: a PING every 30 s, the connection dropped 10 s after one goes
      # unanswered, two connections per channel kept for the life of the process. Containers on
      # one bridge network keep idle connections; shorten the interval behind a NAT or a load
      # balancer that times idle connections out sooner.
      NEXC_GRPC_KEEPALIVE_SECS: ${NEXC_GRPC_KEEPALIVE_SECS:-30}
      NEXC_GRPC_KEEPALIVE_TIMEOUT_SECS: ${NEXC_GRPC_KEEPALIVE_TIMEOUT_SECS:-10}
      NEXC_GRPC_POOL_SIZE: ${NEXC_GRPC_POOL_SIZE:-2}
      # The Agent Firewall API stays off unless NEXC_GRPC_ADDR is set in .env; it is never
      # published by this file: put it behind your own mTLS or private network.
      NEXC_SYMPHONY_URL: http://texc-symphony:4000
      NEXC_SYMPHONY_WORKFLOW: /data/symphony/WORKFLOW.md
      NEXC_CORS_ORIGINS: http://localhost:${NEXC_HTTP_PORT:-8080},https://localhost:${NEXC_HTTPS_PORT:-8443}
      NEXC_TRUST_PROXY: "true"
      NEXC_LLM_PROVIDER: ${NEXC_LLM_PROVIDER:-demo}
      # The lease a replica holds on a run it executes (docs/HA.md); the same on every replica.
      NEXC_RUN_LEASE_SECS: ${NEXC_RUN_LEASE_SECS:-30}
      # A second listener with the agent-token key set alone, for the runtime (Kubernetes lets the
      # runtime reach only this port of the backend; here they share a network).
      NEXC_KEYS_ADDR: 0.0.0.0:8081
    # On SIGTERM the backend fails readiness, hands its runs to the other replicas (their trace
    # written, their lease released) and lets requests in flight finish: give it the time.
    stop_grace_period: 30s
    # A local provider on this machine (NEXC_LLM_BASE_URL=http://host.docker.internal:11434/v1),
    # which runtime-egress reaches too once it is on NEXC_RUNTIME_EGRESS_ALLOW.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nexc-data:/data
      - symphony-config:/data/symphony
    tmpfs:
      - /tmp
    depends_on:
      postgres: { condition: service_healthy }
      agent-runtime: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [web, agents, data, egress]

  agent-runtime:
    <<: *hardening
    image: ghcr.io/f8fvwgzc/nexc-engine-runtime:${NEXC_IMAGE_TAG:-latest}
    pull_policy: missing # local image, else pull the release, else build from source
    build:
      context: ./agent-runtime
    # No env_file on purpose: the runtime only gets what it needs (no DB, JWT or master key).
    # LLM API keys arrive per request from the backend and are never stored.
    environment:
      NEXC_RUNTIME_TOKEN: ${NEXC_RUNTIME_TOKEN:?NEXC_RUNTIME_TOKEN is empty - run `make init`}
      # The backend alone signs the per-run agent tokens (Ed25519); the runtime fetches its
      # public keys from here, by the key id a token names. No signing key ever reaches it.
      NEXC_AGENT_TOKEN_JWKS_URL: http://backend:8081/api/v1/agent-tokens/jwks.json
      # Its only way out: the egress proxy below, which lets through the LLM endpoints of
      # NEXC_RUNTIME_EGRESS_ALLOW and nothing else. The backend is reached directly.
      HTTPS_PROXY: http://runtime-egress:3128
      HTTP_PROXY: http://runtime-egress:3128
      NO_PROXY: backend,localhost,127.0.0.1
      NEXC_LLM_MODEL: ${NEXC_LLM_MODEL:-claude-opus-5}
      RUNTIME_HOST: 0.0.0.0
      RUNTIME_PORT: "8090"
      # The gRPC stream, reachable from the backend only (the `agents` network is internal).
      RUNTIME_GRPC_PORT: "8095"
      RUNTIME_WORKSPACE: /workspace
      RUNTIME_ALLOW_CODE_EXEC: ${RUNTIME_ALLOW_CODE_EXEC:-false}
      RUNTIME_LOG_LEVEL: ${RUNTIME_LOG_LEVEL:-info}
    tmpfs:
      - /workspace:uid=10001,gid=10001,mode=0700,size=512m
      - /tmp:size=64m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # agents only: reachable from the backend, and out through runtime-egress alone. It is on
    # no network with a route to the internet.
    networks: [agents]

  # The agent runtime's egress (`nexc egress-proxy`, from the backend image, with no secrets):
  # CONNECT to the hosts and ports of NEXC_RUNTIME_EGRESS_ALLOW, plain HTTP to a local provider
  # named there (`host.docker.internal:11434` for Ollama on this machine), 403 for anything
  # else, every connection logged. It sees host names, never what is inside TLS: routing the
  # LLM traffic through the tools gateway is an open gap (docs/AGENTSECOPS.md).
  runtime-egress:
    <<: *hardening
    image: ghcr.io/f8fvwgzc/nexc-engine-backend:${NEXC_IMAGE_TAG:-latest}
    pull_policy: missing
    build:
      context: ./backend
    command: ["egress-proxy"]
    environment:
      NEXC_EGRESS_LISTEN: 0.0.0.0:3128
      NEXC_EGRESS_ALLOW: ${NEXC_RUNTIME_EGRESS_ALLOW:-api.anthropic.com:443}
      # On a stop, the model answers streaming through get this long to finish.
      NEXC_EGRESS_DRAIN_SECS: "60"
      NEXC_ENV: ${NEXC_ENV:-development}
      NEXC_LOG: ${NEXC_LOG:-info}
    stop_grace_period: 75s
    # A local provider on this machine (NEXC_LLM_BASE_URL=http://host.docker.internal:11434/v1)
    # is reached from here once its host:port is on the allow-list.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3128/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [agents, egress]

  frontend:
    <<: *hardening
    image: ghcr.io/f8fvwgzc/nexc-engine-frontend:${NEXC_IMAGE_TAG:-latest}
    pull_policy: missing # local image, else pull the release, else build from source
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${NEXC_HTTP_PORT:-8080}:8080"
      # HTTPS with HTTP/2, and HTTP/3 over QUIC on the same port over UDP, once NEXC_TLS_DIR
      # holds tls.crt and tls.key (`make init` makes a self-signed one for localhost in
      # data/tls; `make tls-cert` again, or your own): https://localhost:8443
      - "${NEXC_HTTPS_PORT:-8443}:8443/tcp"
      - "${NEXC_HTTPS_PORT:-8443}:8443/udp"
    environment:
      # The port browsers reach HTTPS on, which Alt-Svc advertises for HTTP/3.
      NEXC_HTTPS_PUBLIC_PORT: ${NEXC_HTTPS_PORT:-8443}
    volumes:
      - ${NEXC_TLS_DIR:-./data/tls}:/etc/nginx/tls:ro
    tmpfs:
      - /tmp
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [web]

  # Optional coding-task executor (https://github.com/f8fvwgzc/texc-symphony).
  # Needs a Codex login once:  docker compose --profile symphony run --rm texc-symphony codex login
  # and NEXC_SYMPHONY_ENABLED=true in .env. The backend writes the managed WORKFLOW.md into the
  # shared `symphony-config` volume; Symphony reads it from /config.
  texc-symphony:
    profiles: [symphony]
    image: ghcr.io/f8fvwgzc/texc-symphony:latest
    restart: unless-stopped
    init: false # the image runs tini as PID 1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - --i-understand-that-this-will-be-running-without-the-usual-guardrails
      - /config/WORKFLOW.md
    environment:
      SYMPHONY_HOST: 0.0.0.0
      SYMPHONY_PORT: "4000"
    volumes:
      - symphony-config:/config:ro
      - symphony-data:/data
      - symphony-workspaces:/workspaces
      - codex-home:/home/symphony/.codex
    depends_on:
      backend: { condition: service_healthy }
    networks: [agents, egress]

volumes:
  pgdata:
  nexc-data:
  symphony-config:
  symphony-data:
  symphony-workspaces:
  codex-home:

networks:
  # Public edge: nginx <-> backend.
  web:
  # backend <-> agent-runtime / texc-symphony. No route to the outside world.
  agents:
    internal: true
  # backend <-> PostgreSQL only.
  data:
    internal: true
  # Outbound internet: LLM APIs (the backend, runtime-egress on the runtime's behalf) and
  # git/Codex (symphony). The agent runtime is not on it.
  egress:
