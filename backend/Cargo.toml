[package]
name = "nexc"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "nexc-engine backend: plans, schedules and executes graphs of LLM and agent tasks"
license = "MIT"
repository = "https://github.com/f8fvwgzc/nexc-engine"
homepage = "https://github.com/f8fvwgzc/nexc-engine"
authors = ["nexc-engine contributors"]
keywords = ["llm", "agents", "dag", "orchestration", "axum"]
categories = ["web-programming::http-server", "command-line-utilities"]
readme = "README.md"
publish = false
# `cargo run` is the backend; the offline bundle verifier is `--bin nexc-verify`.
default-run = "nexc"

[[bin]]
name = "nexc"
path = "src/main.rs"

# Checks a run's evidence bundle offline, with the published public keys alone.
[[bin]]
name = "nexc-verify"
path = "src/bin/nexc_verify.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

[dependencies]
aes-gcm = "0.11"
anyhow = "1.0.104"
aws-lc-rs = "1"
argon2 = "0.6"
async-stream = "0.3.6"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13"
http-body-util = "0.1.5"
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
mime_guess = "2.0.5"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace"] }
prost = "0.14"
prost-types = "0.14"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2", "query"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "derive", "uuid", "chrono", "json", "tls-rustls-aws-lc-rs"] }
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tonic = { version = "0.14", features = ["transport", "codegen", "router", "server", "channel"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit", "set-header", "request-id", "compression-gzip", "timeout", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.27", features = ["v7", "serde"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1.6"
prost = "0.14"
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
