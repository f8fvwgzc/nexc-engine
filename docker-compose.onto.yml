# onto-intelli: the one place the ontology lives (docs/ONTOLOGY.md). Every graph's node and
# relation types, the workspace map (onto-intelli's own UI, embedded by the console), the audit's
# facts and the schema with its proposals. Without it nexc runs with NEXC_ONTO_MODE=off.
#
#   docker compose -f docker-compose.yml -f docker-compose.onto.yml --profile onto up -d --build
#   # or: make demo-onto
#
# onto-intelli is built from the sibling checkout ../onto-intelli (clone
# https://github.com/f8fvwgzc/onto-intelli next to this repository), or pulled as ONTO_IMAGE when
# you built and pushed one (it publishes no image yet). It keeps its data on a PostgreSQL server of
# its own, `onto-postgres` (pgvector/pgvector, which onto-intelli needs, on the volume
# `onto-pgdata`), as the login `onto` (ONTO_POSTGRES_PASSWORD): nexc's PostgreSQL, its image and
# its volume are left as they are, and onto-intelli, which browsers reach, holds no credential of
# nexc's database.
#
# The backend presents NEXC_ONTO_TOKEN; browser sessions are signed with ONTO_SESSION_SECRET
# (`make init` generates them and ONTO_POSTGRES_PASSWORD). Browsers reach onto-intelli's UI on
# ONTO_HTTP_PORT (8081), which the console embeds (its frame-src allows NEXC_ONTO_PUBLIC_URL);
# deploy/onto/onto-intelli.toml lists the console's origin in [ui] embed_origins.
services:
  # onto-intelli's own PostgreSQL (pgvector), reached by onto-intelli only.
  onto-postgres:
    profiles: [onto]
    image: ${ONTO_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    # The Debian-based image's postgres user, so no capabilities are needed at all.
    user: "999:999"
    environment:
      POSTGRES_USER: onto
      POSTGRES_PASSWORD: ${ONTO_POSTGRES_PASSWORD:?ONTO_POSTGRES_PASSWORD is empty - run `make init`}
      POSTGRES_DB: ${ONTO_POSTGRES_DB:-onto}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - onto-pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0775
      - /tmp:uid=999,gid=999,mode=1777
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onto -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [onto-data]

  onto-intelli:
    profiles: [onto]
    image: ${ONTO_IMAGE:-nexc-onto-intelli:local}
    pull_policy: missing # ONTO_IMAGE when set and pullable, else built from ../onto-intelli
    build:
      context: ${ONTO_BUILD_CONTEXT:-../onto-intelli}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    environment:
      ONTO_CONFIG: /etc/onto/onto-intelli.toml
      ONTO_DATABASE_URL: postgres://onto:${ONTO_POSTGRES_PASSWORD}@onto-postgres:5432/${ONTO_POSTGRES_DB:-onto}
      NEXC_ONTO_TOKEN: ${NEXC_ONTO_TOKEN:?NEXC_ONTO_TOKEN is empty - run `make init`}
      ONTO_SESSION_SECRET: ${ONTO_SESSION_SECRET:?ONTO_SESSION_SECRET is empty - run `make init`}
      # Real explanations need a key; without one the mock provider answers offline.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./deploy/onto:/etc/onto:ro
    tmpfs:
      - /tmp
      - /data:mode=1777
    ports:
      # The UI and its HTTP API, for browsers (the console embeds the UI). gRPC shares the port;
      # every call needs a token.
      - "${ONTO_HTTP_PORT:-8081}:50051"
    healthcheck:
      test: ["CMD-SHELL", "onto call system.health '{}' --remote http://127.0.0.1:50051 --token \"$$NEXC_ONTO_TOKEN\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      onto-postgres: { condition: service_healthy }
    networks: [agents, onto-data, egress]

  backend:
    environment:
      NEXC_ONTO_MODE: service
      NEXC_ONTO_URL: ${NEXC_ONTO_URL:-http://onto-intelli:50051}
      NEXC_ONTO_PUBLIC_URL: ${NEXC_ONTO_PUBLIC_URL:-http://localhost:8081}

  # The console's Content-Security-Policy lets it frame onto-intelli's UI from there.
  frontend:
    environment:
      NEXC_ONTO_PUBLIC_URL: ${NEXC_ONTO_PUBLIC_URL:-http://localhost:8081}

volumes:
  onto-pgdata:

networks:
  # onto-intelli <-> its PostgreSQL only.
  onto-data:
    internal: true
