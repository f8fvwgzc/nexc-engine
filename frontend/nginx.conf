# nexc frontend: SPA + reverse proxy to the backend (HTTP, SSE and WebSocket).
# Runs in nginxinc/nginx-unprivileged (listens on 8080 and 8443, writes only to /tmp).
#
# Two listeners serve the same site (nexc/site.conf): plain HTTP on 8080, always (local use, the
# probes, and behind an ingress or load balancer that terminates TLS), and HTTPS on 8443 with
# HTTP/2, and HTTP/3 over QUIC on UDP 8443, once a certificate is mounted at /etc/nginx/tls
# (docs/adr/0001-http3-edge-caching-and-indexes.md). Behind nginx, the backend is reached over
# pooled HTTP/1.1 connections and the services talk gRPC over HTTP/2.

# The backend, by name, looked up again every 10 s while nginx runs (`server ... resolve` and a
# resolver, nginx 1.27.3+): a recreated or scaled backend is reached at its new addresses without
# restarting the frontend. /docker-entrypoint.d/39-nexc-backend.sh writes the server and the
# resolver from NEXC_BACKEND_UPSTREAM and /etc/resolv.conf. The zone is what `resolve` needs:
# the addresses, shared by the workers.
upstream nexc_backend {
    zone nexc_backend 64k;
    include /tmp/nginx/backend.conf;
    keepalive 32;
}

# WebSocket upgrade: "upgrade" when the client asks for a WebSocket, otherwise an empty Connection
# header so the upstream connection stays alive. Only HTTP/1.1 carries an Upgrade: nginx has no
# WebSocket over HTTP/2 or HTTP/3 (RFC 8441, RFC 9220), so browsers open WebSockets on a TCP
# connection of their own, to the plain or the HTTPS listener.
map $http_upgrade $connection_upgrade {
    ~*^websocket$ upgrade;
    default       "";
}

# The scheme the client used: https on the HTTPS listener, whatever the request claims; else the
# one a TLS-terminating ingress / load balancer reports; else this connection's.
map "$https:$http_x_forwarded_proto" $forwarded_proto {
    ~^on:   https;
    ":"     $scheme;
    default $http_x_forwarded_proto;
}

# HSTS only when the request actually arrived over HTTPS (HSTS-ready, harmless on plain http),
# and never for a loopback name: a browser that trusts a local certificate (mkcert) would pin
# https for every port of localhost, the plain console on 8080 included.
map "$forwarded_proto:$host" $hsts_header {
    "~^https:(localhost|127\.0\.0\.1|\[::1\])$" "";
    "~^https:"                                   "max-age=63072000; includeSubDomains";
    default                                      "";
}

# Hashed build assets: a year for what is there. A miss is never kept, so an asset a rolling
# deploy has not reached yet is asked for again instead of being remembered as missing.
map $status $asset_cache_control {
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-store";
}

# The public documents (nexc/public-cache.conf), the only answers kept at the edge.
proxy_cache_path /tmp/nginx/cache levels=1:2 keys_zone=nexc_public:1m max_size=16m
                 inactive=10m use_temp_path=off;

server {
    listen 8080;
    listen [::]:8080;
    # Alt-Svc is sent on the HTTPS listener only: a browser ignores it on plain http.
    set $alt_svc "";
    include /etc/nginx/nexc/site.conf;
}

# HTTPS, HTTP/2 and HTTP/3, written by /docker-entrypoint.d/41-nexc-tls.sh from
# nexc/tls-server.conf.template when a certificate is mounted, and empty otherwise.
include /tmp/nginx/tls-server.conf;
