# nexc frontend: SPA + reverse proxy to the backend (HTTP, SSE and WebSocket).
# Runs in nginxinc/nginx-unprivileged (listens on 8080, writes only to /tmp).

upstream nexc_backend {
    server backend:8080;
    keepalive 32;
}

# WebSocket upgrade: "upgrade" when the client asks for it, otherwise keep the upstream alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Respect the scheme reported by a TLS-terminating ingress / load balancer.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HSTS only when the request actually arrived over HTTPS (HSTS-ready, harmless on plain http).
map $forwarded_proto $hsts_header {
    https   "max-age=63072000; includeSubDomains";
    default "";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/event-stream is deliberately absent: compressing SSE would buffer the stream.
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/problem+json application/manifest+json image/svg+xml font/ttf;

    # --- security headers for everything nginx serves itself ---------------------------------
    # The one Content-Security-Policy of the console (the build carries none; `vite preview`
    # sends the same, frontend/vite.config.ts). frame-src is onto-intelli's UI, which the
    # workspace map embeds: the origin of NEXC_ONTO_PUBLIC_URL, or 'none' without one, written
    # to /tmp at start by /docker-entrypoint.d/40-nexc-frame-src.sh.
    include /tmp/nginx/frame-src.conf;
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src $onto_frame_src; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- liveness for container healthchecks / probes -----------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API: REST + SSE (/graphs/{id}/events) + WebSocket (/graphs/{id}/ws) -----------------
    location /api/ {
        proxy_pass http://nexc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Stream SSE and large downloads straight through.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_connect_timeout 5s;

        # The backend sets its own security headers on API responses (incl. /api/docs).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    # --- A2A (CONTRACT §10): the agent cards and the JSON-RPC endpoint live at the root --------
    location /a2a/ {
        proxy_pass http://nexc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # tasks/sendSubscribe streams; a task may carry files inline (base64).
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_connect_timeout 5s;
        client_max_body_size 16m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    location = /.well-known/agent.json {
        proxy_pass http://nexc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    # --- metrics are internal: scrape the backend directly, never through the public edge -----
    location = /metrics {
        return 404;
    }

    # --- hashed build assets: cache forever -------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- the SPA shell must always be revalidated ---------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # --- client-side routing fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps' neighbours by accident.
    location ~ /\. {
        deny all;
    }
}
