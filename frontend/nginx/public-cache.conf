# The edge cache of a public document: the key set and the agent cards, the same for every
# caller (nginx.conf, zone nexc_public). A copy lives as long as the backend's
# `Cache-Control: public, max-age` says; when it expires, one request refreshes it (by ETag, so
# usually a 304) while the others are answered from the copy, which also answers while the
# backend cannot be reached. X-Cache-Status says which (HIT, MISS, UPDATING, STALE, ...).
proxy_cache nexc_public;
proxy_cache_key $host$request_uri;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_revalidate on;
proxy_cache_background_update on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
# None of them needs credentials: a request that brings some goes to the backend, and what it
# gets back is not kept.
proxy_cache_bypass $http_authorization;
proxy_no_cache $http_authorization;
add_header X-Cache-Status $upstream_cache_status always;
