# The site both listeners of nginx.conf serve: the SPA, the API behind it and the public
# documents. $alt_svc is set by the listener: HTTP/3 on the HTTPS one, empty (so not sent) on
# plain http. add_header in a location replaces the server's, so every location that sets
# headers of its own repeats Alt-Svc.

server_name _;

root /usr/share/nginx/html;
index index.html;

server_tokens off;
# Requests are small (the backend takes 1 MiB, CONTRACT §3), except a knowledge document and an
# A2A task, whose locations below allow more.
client_max_body_size 2m;
charset utf-8;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
# text/event-stream is deliberately absent: compressing SSE would buffer the stream.
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/problem+json application/manifest+json image/svg+xml font/ttf;
# The build is compressed once, at its best level, when the image is built (Dockerfile): a
# client that takes gzip gets the .gz beside the file, and nothing is compressed per request.
gzip_static on;
# The static files never change inside a running image: their descriptors and sizes (and
# whether a .gz is beside them) are kept between requests.
open_file_cache max=2000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_errors on;

# --- security headers for everything nginx serves itself -------------------------------------
# The one Content-Security-Policy of the console (the build carries none; `vite preview`
# sends the same, frontend/vite.config.ts). frame-src is onto-intelli's UI, which the
# workspace map embeds: the origin of NEXC_ONTO_PUBLIC_URL, or 'none' without one, written
# to /tmp at start by /docker-entrypoint.d/40-nexc-frame-src.sh.
include /tmp/nginx/frame-src.conf;
set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src $onto_frame_src; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

add_header Content-Security-Policy $csp always;
add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Alt-Svc $alt_svc always;
# The files at the root that carry no hash (favicon.svg, theme-init.js): asked again (a 304 by
# their ETag) rather than kept stale after a deploy.
add_header Cache-Control "no-cache" always;

# --- liveness for container healthchecks / probes ---------------------------------------------
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# --- API: REST + SSE (/graphs/{id}/events) + WebSocket (/graphs/{id}/ws) ---------------------
location /api/ {
    proxy_pass http://nexc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Stream SSE and large downloads straight through. Nothing here is kept at the edge but the
    # agent-token key set below: every other answer is private to its caller or never kept
    # (CONTRACT §3), and the browser revalidates what it may keep by ETag.
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 5s;

    # The backend sets its own security headers on API responses (incl. /api/docs).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Alt-Svc $alt_svc always;

    # A knowledge document: up to 50 MiB and its multipart envelope (DOCUMENT_MAX_BYTES plus
    # UPLOAD_SLACK, 64 KiB), so the backend's own 413 answers what is over. Everything else of
    # /api/ above applies here too, but proxy_pass, which a nested location does not inherit.
    location ~ ^/api/v1/workspaces/[^/]+/documents$ {
        proxy_pass http://nexc_backend;
        client_max_body_size 51m;
    }
}

# The public keys of the per-run agent tokens: anonymous and the same for every caller, so kept at
# the edge like the documents below (the runtime itself reads them from NEXC_KEYS_ADDR).
location = /api/v1/agent-tokens/jwks.json {
    proxy_pass http://nexc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    include /etc/nginx/nexc/public-cache.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Alt-Svc $alt_svc always;
}

# --- A2A (CONTRACT §10): the agent cards and the JSON-RPC endpoint live at the root ------------
location /a2a/ {
    proxy_pass http://nexc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    # Without it nginx sends "Connection: close" and the upstream connection is not reused.
    proxy_set_header Connection "";

    # tasks/sendSubscribe streams; a task may carry files inline (base64).
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 5s;
    # The backend takes 16 MiB (RPC_BODY_LIMIT); a little more here, so its 413 is the answer.
    client_max_body_size 17m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Alt-Svc $alt_svc always;
}

# --- the public documents, kept at the edge (nexc/public-cache.conf) --------------------------
# An exposed agent's card, under its id or its percent-encoded principal (decoded here).
location ~ ^/a2a/agents/.+/card$ {
    proxy_pass http://nexc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    include /etc/nginx/nexc/public-cache.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Alt-Svc $alt_svc always;
}

location = /.well-known/agent.json {
    proxy_pass http://nexc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    include /etc/nginx/nexc/public-cache.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Alt-Svc $alt_svc always;
}

# The public keys run seals, firewall decisions and evidence bundles verify with
# (docs/AGENTSECOPS.md §12); exact, so the dotfile rule below still hides everything else.
location = /.well-known/jwks.json {
    proxy_pass http://nexc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    include /etc/nginx/nexc/public-cache.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Alt-Svc $alt_svc always;
}

# --- metrics are internal: scrape the backend directly, never through the public edge ---------
location = /metrics {
    return 404;
}

# --- hashed build assets (Vite's /assets/<name>-<hash>.<ext>): cache forever, misses never ----
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control $asset_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Alt-Svc $alt_svc always;
}

# --- the SPA shell (and so every client-side route) is revalidated on every load --------------
# no-cache, not no-store: the browser and any CDN may keep it, but ask first (a 304 by its ETag),
# so a deploy is picked up at once.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Alt-Svc $alt_svc always;
}

# --- client-side routing fallback -------------------------------------------------------------
location / {
    try_files $uri $uri/ /index.html;
}

# Never serve dotfiles or source maps' neighbours by accident.
location ~ /\. {
    deny all;
}
