version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      rust-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /agent-runtime
    schedule: { interval: weekly, day: monday }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /agent-runtime]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      # The project targets PostgreSQL 17; a major upgrade needs a dump/restore and is a
      # deliberate decision, not a routine bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      # Its refs name Rust toolchains, not action releases; the toolchain is pinned in
      # backend/rust-toolchain.toml and bumped together with the code.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
