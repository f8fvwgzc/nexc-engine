name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        **Security vulnerabilities must not be reported here** - see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a graph with ...
        2. Click "Run"
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web UI (frontend)
        - API / scheduler (backend)
        - Agent runtime
        - Deployment (Docker Compose / Kubernetes)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run nexc-engine?
      options:
        - make dev (local)
        - Docker Compose
        - Kubernetes / minikube
        - Other
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: LLM provider
      options: [demo, anthropic, openai_compatible]
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and API keys before pasting. This is rendered as code.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Docker / Kubernetes version
