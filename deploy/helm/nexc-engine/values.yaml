# nexc-engine Helm chart: one release per namespace (object names are fixed, as in deploy/k8s).
#
#   scripts/init-env.sh --k8s
#   kubectl create namespace nexc
#   kubectl label namespace nexc pod-security.kubernetes.io/enforce=restricted
#   kubectl -n nexc create secret generic nexc-secrets --from-env-file=deploy/k8s/secret.env
#   helm install nexc deploy/helm/nexc-engine -n nexc --set secrets.existingSecret=nexc-secrets
#
# Or let the chart write the Secret: --set secrets.values.POSTGRES_PASSWORD=... and so on for
# every key of deploy/k8s/secret.example.env (NEXC_DATABASE_URL is derived when empty).

images:
  backend:
    repository: ghcr.io/f8fvwgzc/nexc-engine-backend
    tag: "" # Chart.appVersion when empty; `local` for images built by scripts/minikube-up.sh
  runtime:
    repository: ghcr.io/f8fvwgzc/nexc-engine-runtime
    tag: ""
  frontend:
    repository: ghcr.io/f8fvwgzc/nexc-engine-frontend
    tag: ""
  postgres:
    repository: postgres
    tag: 17-alpine
  pullPolicy: IfNotPresent

replicas:
  backend: 2
  runtime: 2
  frontend: 2

# Non-secret settings of every service (ConfigMap nexc-config); CONTRACT §2 lists them.
# `development` because an ingress without TLS serves plain http and production mode forces
# Secure cookies: with TLS, set NEXC_ENV=production, NEXC_COOKIE_SECURE=true and
# NEXC_CORS_ORIGINS=https://<your host>.
config:
  NEXC_ENV: development
  NEXC_LOG: info
  NEXC_DB_MAX_CONNECTIONS: "20"
  NEXC_CORS_ORIGINS: http://nexc.local
  NEXC_COOKIE_SECURE: "false"
  NEXC_ALLOW_SIGNUP: "true"
  NEXC_TRUST_PROXY: "true"
  NEXC_ACCESS_TTL_SECS: "900"
  NEXC_REFRESH_TTL_SECS: "1209600"
  NEXC_LLM_PROVIDER: demo
  NEXC_LLM_MODEL: claude-opus-5
  NEXC_LLM_FALLBACKS: "true"
  NEXC_SYMPHONY_ENABLED: "false"
  NEXC_SYMPHONY_URL: http://texc-symphony:4000
  NEXC_SYMPHONY_WORKFLOW: /data/symphony/WORKFLOW.md
  NEXC_MAX_CONCURRENCY: "4"
  NEXC_MAX_ATTEMPTS: "3"
  NEXC_NODE_TIMEOUT_SECS: "600"
  # Public keys (hex or base64, comma-separated) of signing keys rotated out, still published at
  # /.well-known/jwks.json so what they signed verifies (docs/AGENTSECOPS.md §12).
  NEXC_SIGNING_KEYS_RETIRED: ""

backend:
  # The runtime wire: `grpc` (the default) or `ndjson` (kept for one release).
  runtimeProtocol: grpc
  # The Agent Firewall API (CONTRACT §8): the address the backend serves it on, e.g.
  # 0.0.0.0:50052. Empty keeps it off. When set, the backend Service exposes `firewall.port` and
  # the NetworkPolicy admits the namespaces of `networkPolicies.firewallFrom`.
  grpcAddr: ""
  firewall:
    port: 50052
  # OpenTelemetry: the OTLP/gRPC collector every span is exported to; empty keeps it off.
  otlpEndpoint: ""
  # onto-intelli, where the ontology lives (docs/ONTOLOGY.md): an `onto serve` you run, by its
  # gRPC and HTTP endpoint. Empty: the chart's own (ontoIntelli.enabled) or, without one, off
  # (graphs keep the read-only starter vocabulary, no workspace map). Its token goes in the
  # Secret as NEXC_ONTO_TOKEN.
  ontoUrl: ""
  # Where browsers reach onto-intelli's UI, which the console embeds as its workspace map (and
  # frames: the frontend's Content-Security-Policy allows its origin), e.g.
  # https://onto.nexc.example.com. Empty: ontoUrl, or ontoIntelli.ingress.host when onto-intelli
  # is in the release.
  ontoPublicUrl: ""
  ontoWorkspacePrefix: nexc-
  # How long a graph's vocabulary is served from memory (0: every read asks onto-intelli).
  ontoVocabularyTtlSecs: 30
  # Lifetime of the browser sessions the console mints for onto-intelli's UI.
  ontoSessionTtlSecs: 3600
  gateway:
    callsPerMinute: 120
    timeoutSecs: 30
    maxResponseBytes: 1048576
  # The A2A adapter: the longest one outbound task may take (the remote agent's work included).
  a2a:
    timeoutSecs: 120
  # HTTP/2 keepalive of the gRPC channels the backend opens (runtime, onto-intelli, OTLP) and of
  # the Agent Firewall server: a PING every keepaliveSecs, the connection dropped after
  # keepaliveTimeoutSecs without an answer; poolSize connections per channel. Keep the interval
  # under the idle timeout of whatever sits between the pods (a mesh sidecar, a cloud NAT).
  grpc:
    keepaliveSecs: 30
    keepaliveTimeoutSecs: 10
    poolSize: 2
  # Hot-read caches: the longest an entry lives; writes drop entries on every replica through
  # PostgreSQL NOTIFY. 0 turns them off.
  cacheTtlSecs: 60
  # The LLM circuit breaker: consecutive provider failures that open a circuit (0 turns it off)
  # and how long it stays open before a probe.
  llmBreaker:
    failures: 5
    openSecs: 30
  # High availability of runs (docs/HA.md): the lease a replica holds on a run it executes,
  # renewed every third of it. When a replica dies, a peer takes its runs over once their lease
  # ran out (this plus a few seconds). On SIGTERM a replica fails readiness, hands its runs to
  # its peers at once and exits; the grace period leaves room for that and for HTTP requests in
  # flight.
  runLeaseSecs: 30
  terminationGracePeriodSeconds: 60
  # The backend's data volume (NEXC_DATA_DIR: run artifacts, uploaded documents), mounted by every
  # backend replica. ReadWriteOnce attaches it to one node: fine on a single-node cluster. With
  # backend replicas on several nodes (the chart spreads them across nodes, and the autoscaler
  # adds more) use a ReadWriteMany class (NFS, EFS, Filestore, CephFS) in dataStorageClass, so a
  # replica that takes a run over sees its artifacts; or name a claim you made in
  # dataExistingClaim, which the chart then mounts instead of creating `backend-data`.
  dataStorage: 5Gi
  dataAccessMode: ReadWriteOnce
  dataStorageClass: ""
  dataExistingClaim: ""
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }

runtime:
  httpPort: 8090
  # The gRPC stream the backend opens (AgentRuntime/Execute), admitted from the backend only.
  grpcPort: 8095
  allowCodeExec: false
  logLevel: info
  workspaceSize: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi, ephemeral-storage: 2Gi }

frontend:
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

# onto-intelli in the release (docs/ONTOLOGY.md): a Deployment and a Service on port `port`,
# configured as nexc needs it (tenants per workspace, impersonation, governance, the UI's
# embed_origins). It keeps its data in its own database on the chart's PostgreSQL, as its own
# login `onto` (ONTO_POSTGRES_PASSWORD in the Secret), which then needs pgvector 0.7+: set
# images.postgres to pgvector/pgvector:pg17 on a new installation (an existing Alpine volume moves
# with pg_dump and pg_restore, never by pointing the new image at it), or, with
# postgres.enabled=false, put ONTO_DATABASE_URL in the Secret. The Secret also needs
# NEXC_ONTO_TOKEN and ONTO_SESSION_SECRET (scripts/init-env.sh --k8s generates all three).
ontoIntelli:
  enabled: false
  # onto-intelli publishes no image yet: build it from its repository (`docker build -t
  # <registry>/onto-intelli:<tag> ../onto-intelli`), push it to your registry and name it here.
  # The chart refuses to render with ontoIntelli.enabled and no repository.
  image:
    repository: ""
    tag: ""
  replicas: 1
  port: 50051
  database: onto
  # Its PostgreSQL pool, per replica. Each tenant it has open (one per nexc workspace) keeps one
  # connection for its LISTEN as long as the pod runs: size it above the number of workspaces,
  # and the chart's PostgreSQL (max_connections 100) above it plus the backend's pools.
  maxConnections: 48
  requiredApprovals: 1
  # mock answers the audit offline; anthropic needs ANTHROPIC_API_KEY (anthropicApiKeyFromSecret).
  llmProvider: mock
  anthropicApiKeyFromSecret: false
  # The console's origins, allowed to embed the UI and hand it a session. Empty: the ingress host
  # (https when ingress.tls covers it); the chart refuses to render with neither.
  embedOrigins: []
  # A host of its own on the ingress for browsers (the UI and its HTTP API). It is where browsers
  # reach onto-intelli (NEXC_ONTO_PUBLIC_URL, https when ingress.tls lists it) unless
  # backend.ontoPublicUrl says otherwise; with ontoIntelli.enabled one of the two is required,
  # since browsers cannot reach the Service onto-intelli.
  ingress:
    host: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "2", memory: 2Gi }

postgres:
  # false: bring your own (a managed database or an operator) and put its URL in the Secret as
  # NEXC_DATABASE_URL.
  enabled: true
  storage: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# Single sign-on with an OpenID Connect provider (CONTRACT §5; the guide is Operate, Single
# sign-on). Off unless enabled. Register `<public URL>/api/v1/auth/oidc/callback` at the provider
# (or set redirectUrl). The client secret is never a value here: it is read from the Secret
# `existingSecret`, key `existingSecretKey`.
oidc:
  enabled: false
  # The issuer identifier, exactly as the provider's tokens carry it (https://...).
  issuer: ""
  clientId: ""
  existingSecret: ""
  existingSecretKey: client-secret
  # Empty: NEXC_PUBLIC_URL + /api/v1/auth/oidc/callback; set config.NEXC_PUBLIC_URL to where the
  # console is reached from outside (the chart refuses to render without one of the two). Set,
  # it must be the console's own host followed by /api/v1/auth/oidc/callback.
  redirectUrl: ""
  scopes: [openid, email, profile]
  # The login page's button reads "Continue with <displayName>".
  displayName: SSO
  groupsClaim: groups
  # Members of these groups administer the platform.
  adminGroups: []
  # Workspace roles by group, applied at every sign-in; the workspace by its id (the platform
  # console's Workspaces shows it; slugs are refused), the role owner, admin, member or guest. A
  # role the mapping gave is taken back without the group.
  # - { group: engineering, workspace: 0190f3a2-7b1c-7d2e-8f00-00000000ac3e, role: member }
  workspaceRoles: []
  # false hides and refuses password sign-in, except for the break-glass platform administrator.
  allowLocalLogin: true
  breakGlassEmail: ""
  requireVerifiedEmail: true

secrets:
  # The name of a Secret holding the keys of deploy/k8s/secret.example.env. Empty: the chart
  # writes `nexc-secrets` from `values` below, and refuses to render while a required one is
  # empty.
  existingSecret: ""
  values:
    POSTGRES_USER: nexc
    POSTGRES_DB: nexc
    POSTGRES_PASSWORD: ""
    NEXC_DATABASE_URL: "" # postgres://<user>:<password>@postgres:5432/<db> when empty
    NEXC_JWT_SECRET: ""
    NEXC_MASTER_KEY: ""
    NEXC_RUNTIME_TOKEN: ""
    NEXC_AGENT_TOKEN_KEY: ""
    NEXC_METRICS_TOKEN: ""
    # Signs run seals, firewall decisions and evidence bundles (the older name
    # NEXC_FIREWALL_SIGNING_KEY is still read); empty derives it from NEXC_MASTER_KEY.
    NEXC_SIGNING_KEY: ""
    NEXC_ONTO_TOKEN: ""
    ONTO_SESSION_SECRET: ""
    # onto-intelli's own login on the chart's PostgreSQL (role `onto`, owning its database only).
    ONTO_POSTGRES_PASSWORD: ""
    ANTHROPIC_API_KEY: ""
    NEXC_ADMIN_EMAIL: ""
    NEXC_ADMIN_PASSWORD: ""

ingress:
  enabled: true
  className: nginx
  host: nexc.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  # - hosts: [nexc.example.com]
  #   secretName: nexc-tls
  tls: []

networkPolicies:
  enabled: true
  # The namespace of the ingress controller (kubernetes.io/metadata.name).
  ingressNamespace: ingress-nginx
  # Namespaces whose pods may call the Agent Firewall API when `backend.grpcAddr` is set.
  firewallFrom: []

podDisruptionBudgets:
  enabled: true
  # At most this many pods of the backend, the runtime and the frontend are evicted at once by a
  # voluntary disruption (a node drain). A backend pod that goes hands its runs to the others.
  maxUnavailable: 1

# Optional HorizontalPodAutoscalers on CPU. When one is enabled, `replicas` above no longer sets
# that Deployment's size; `minReplicas` should stay at 2 or more so a peer is there to take runs
# over (backend) and to take the next attempt (runtime).
autoscaling:
  backend:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  runtime:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
