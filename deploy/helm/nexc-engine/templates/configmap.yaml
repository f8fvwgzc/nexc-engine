# Non-secret configuration of every service. The checksum annotation on the Deployments rolls
# the pods when it changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexc-config
  labels:
    {{- include "nexc.labels" . | nindent 4 }}
data:
  {{- $pool := include "nexc.dbPool" . }}
  {{- range $key, $value := .Values.config }}
  {{- if not (or (eq $key "NEXC_DB_MAX_CONNECTIONS") (and (has $key (list "NEXC_CORS_ORIGINS" "NEXC_PUBLIC_URL")) (not $value))) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  # The backend's pool per pod: config.NEXC_DB_MAX_CONNECTIONS, or its share of the connection
  # budget (postgres.maxConnections).
  NEXC_DB_MAX_CONNECTIONS: {{ $pool | quote }}
  {{- $public := include "nexc.publicUrl" . }}
  {{- if and (not .Values.config.NEXC_PUBLIC_URL) $public }}
  NEXC_PUBLIC_URL: {{ $public | quote }}
  {{- end }}
  {{- if and (not .Values.config.NEXC_CORS_ORIGINS) $public }}
  NEXC_CORS_ORIGINS: {{ $public | quote }}
  {{- end }}
  {{- if and (eq (toString .Values.config.NEXC_ENV) "production") .Values.ingress.enabled (not (include "nexc.tlsHost" (dict "host" .Values.ingress.host "root" .))) }}
  {{- fail "NEXC_ENV=production serves the console over TLS only (its cookies are Secure): set ingress.tlsSecretName (or ingress.tls), or ingress.tlsUpstream=true when TLS ends in front of the ingress; a plain-http trial sets config.NEXC_ENV=development and config.NEXC_COOKIE_SECURE=false" }}
  {{- end }}
  NEXC_HOST: "0.0.0.0"
  NEXC_PORT: "8080"
  NEXC_DATA_DIR: /data
  NEXC_RUNTIME_URL: http://agent-runtime:{{ .Values.runtime.httpPort }}
  NEXC_RUNTIME_PROTOCOL: {{ .Values.backend.runtimeProtocol | quote }}
  NEXC_RUNTIME_GRPC_URL: http://agent-runtime:{{ .Values.runtime.grpcPort }}
  # The backend's second listener: the agent-token key set alone, the one port of the backend
  # the runtime may reach.
  NEXC_KEYS_ADDR: "0.0.0.0:8081"
  NEXC_RUNTIME_EGRESS_ALLOW: {{ include "nexc.egressAllow" . | quote }}
  NEXC_GATEWAY_CALLS_PER_MINUTE: {{ .Values.backend.gateway.callsPerMinute | quote }}
  NEXC_GATEWAY_TIMEOUT_SECS: {{ .Values.backend.gateway.timeoutSecs | quote }}
  NEXC_GATEWAY_MAX_RESPONSE_BYTES: {{ .Values.backend.gateway.maxResponseBytes | quote }}
  NEXC_A2A_TIMEOUT_SECS: {{ .Values.backend.a2a.timeoutSecs | quote }}
  NEXC_GRPC_KEEPALIVE_SECS: {{ .Values.backend.grpc.keepaliveSecs | quote }}
  NEXC_GRPC_KEEPALIVE_TIMEOUT_SECS: {{ .Values.backend.grpc.keepaliveTimeoutSecs | quote }}
  NEXC_GRPC_POOL_SIZE: {{ .Values.backend.grpc.poolSize | quote }}
  NEXC_CACHE_TTL_SECS: {{ .Values.backend.cacheTtlSecs | quote }}
  NEXC_RUN_LEASE_SECS: {{ .Values.backend.runLeaseSecs | quote }}
  NEXC_SEED_EXPERT_AGENTS: {{ .Values.backend.seedExpertAgents | quote }}
  NEXC_LLM_BREAKER_FAILURES: {{ .Values.backend.llmBreaker.failures | quote }}
  NEXC_LLM_BREAKER_OPEN_SECS: {{ .Values.backend.llmBreaker.openSecs | quote }}
  {{- if .Values.backend.grpcAddr }}
  NEXC_GRPC_ADDR: {{ .Values.backend.grpcAddr | quote }}
  {{- end }}
  {{- if .Values.backend.otlpEndpoint }}
  NEXC_OTLP_ENDPOINT: {{ .Values.backend.otlpEndpoint | quote }}
  {{- end }}
  {{- $ontoUrl := include "nexc.ontoUrl" . }}
  {{- if $ontoUrl }}
  NEXC_ONTO_MODE: service
  NEXC_ONTO_URL: {{ $ontoUrl | quote }}
  NEXC_ONTO_PUBLIC_URL: {{ include "nexc.ontoPublicUrl" . | quote }}
  NEXC_ONTO_WORKSPACE_PREFIX: {{ .Values.backend.ontoWorkspacePrefix | quote }}
  NEXC_ONTO_VOCABULARY_TTL_SECS: {{ .Values.backend.ontoVocabularyTtlSecs | quote }}
  NEXC_ONTO_READ_CACHE_SECS: {{ .Values.backend.ontoReadCacheSecs | quote }}
  NEXC_ONTO_SESSION_TTL_SECS: {{ .Values.backend.ontoSessionTtlSecs | quote }}
  {{- else }}
  NEXC_ONTO_MODE: "off"
  {{- end }}
  {{- with .Values.oidc }}
  {{- if .enabled }}
  {{- if not .issuer }}
  {{- fail "oidc.enabled needs oidc.issuer" }}
  {{- end }}
  {{- if not .clientId }}
  {{- fail "oidc.enabled needs oidc.clientId" }}
  {{- end }}
  {{- if not .existingSecret }}
  {{- fail "oidc.enabled needs oidc.existingSecret: a Secret holding the client secret" }}
  {{- end }}
  {{- if and (not .redirectUrl) (not $.Values.config.NEXC_PUBLIC_URL) }}
  {{- fail "oidc.enabled needs config.NEXC_PUBLIC_URL (the console's public address, which the redirect URL is derived from) or oidc.redirectUrl" }}
  {{- end }}
  NEXC_OIDC_ISSUER: {{ .issuer | quote }}
  NEXC_OIDC_CLIENT_ID: {{ .clientId | quote }}
  {{- if .redirectUrl }}
  NEXC_OIDC_REDIRECT_URL: {{ .redirectUrl | quote }}
  {{- end }}
  NEXC_OIDC_SCOPES: {{ join " " .scopes | quote }}
  NEXC_OIDC_DISPLAY_NAME: {{ .displayName | quote }}
  NEXC_OIDC_GROUPS_CLAIM: {{ .groupsClaim | quote }}
  NEXC_OIDC_ADMIN_GROUPS: {{ join "," .adminGroups | quote }}
  {{- $roles := list }}
  {{- range .workspaceRoles }}
  {{- $roles = append $roles (printf "%s=%s:%s" .group .workspace .role) }}
  {{- end }}
  NEXC_OIDC_WORKSPACE_ROLES: {{ join "," $roles | quote }}
  NEXC_OIDC_ALLOW_LOCAL_LOGIN: {{ .allowLocalLogin | quote }}
  NEXC_OIDC_BREAK_GLASS_EMAIL: {{ .breakGlassEmail | quote }}
  NEXC_OIDC_REQUIRE_VERIFIED_EMAIL: {{ .requireVerifiedEmail | quote }}
  {{- end }}
  {{- end }}
  RUNTIME_HOST: "0.0.0.0"
  RUNTIME_PORT: {{ .Values.runtime.httpPort | quote }}
  RUNTIME_GRPC_PORT: {{ .Values.runtime.grpcPort | quote }}
  RUNTIME_WORKSPACE: /workspace
  RUNTIME_ALLOW_CODE_EXEC: {{ .Values.runtime.allowCodeExec | quote }}
  RUNTIME_LOG_LEVEL: {{ .Values.runtime.logLevel | quote }}
