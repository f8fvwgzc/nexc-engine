{{- if .Values.ingress.enabled }}
# The host -> frontend (SPA); /api goes straight to the backend so SSE and WebSockets skip a hop,
# and so do the A2A surface (/a2a, /.well-known/agent.json; CONTRACT §10) and the signing keys
# (/.well-known/jwks.json). /metrics is not routed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexc
  labels:
    {{- include "nexc.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /a2a
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /.well-known/agent.json
            pathType: Exact
            backend:
              service: { name: backend, port: { name: http } }
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service: { name: backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
    {{- if and .Values.ontoIntelli.enabled .Values.ontoIntelli.ingress.host }}
    # onto-intelli's UI and HTTP API, for browsers (the console embeds the UI).
    - host: {{ .Values.ontoIntelli.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: onto-intelli, port: { name: http } }
    {{- end }}
{{- end }}
