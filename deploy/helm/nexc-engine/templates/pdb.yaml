{{- if .Values.podDisruptionBudgets.enabled }}
# Keep at least one replica of each stateless tier during voluntary disruptions (node drains).
{{- range $name := list "backend" "agent-runtime" "frontend" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "nexc.labels" $ | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
{{- end }}
{{- end }}
