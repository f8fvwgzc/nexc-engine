{{- if .Values.podDisruptionBudgets.enabled }}
# Voluntary disruptions (node drains) take at most `maxUnavailable` pods of each stateless tier
# at once. A backend pod that is evicted drains: it fails readiness and hands its runs to its
# peers before it exits (docs/HA.md).
{{- range $name := list "backend" "agent-runtime" "frontend" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "nexc.labels" $ | nindent 4 }}
spec:
  maxUnavailable: {{ $.Values.podDisruptionBudgets.maxUnavailable }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
{{- end }}
{{- end }}
