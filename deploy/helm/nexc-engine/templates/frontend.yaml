# Web UI: nginx serving the SPA and proxying /api to the backend.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    {{- include "nexc.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    {{- include "nexc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.frontend }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/component: web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "nexc.podSecurity" (dict "uid" 101 "fsGroup" false) | nindent 8 }} # nginx-unprivileged
      containers:
        - name: frontend
          image: {{ include "nexc.image" (dict "image" .Values.images.frontend "chart" .Chart) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- with include "nexc.ontoUrl" . }}
          env:
            # The Content-Security-Policy's frame-src: onto-intelli's UI, which the map embeds.
            - name: NEXC_ONTO_PUBLIC_URL
              value: {{ include "nexc.ontoPublicUrl" $ | quote }}
          {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "nexc.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
