{{- if not .Values.secrets.existingSecret }}
{{- $v := .Values.secrets.values }}
{{- range $key := list "POSTGRES_PASSWORD" "NEXC_JWT_SECRET" "NEXC_MASTER_KEY" "NEXC_RUNTIME_TOKEN" }}
{{- if not (index $v $key) }}
{{- fail (printf "secrets.values.%s is empty: set it, or point secrets.existingSecret at a Secret made from deploy/k8s/secret.env (scripts/init-env.sh --k8s)" $key) }}
{{- end }}
{{- end }}
# The secrets every service reads: generated by scripts/init-env.sh --k8s, or given as values.
apiVersion: v1
kind: Secret
metadata:
  name: nexc-secrets
  labels:
    {{- include "nexc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $v }}
  {{- if and (ne $key "NEXC_DATABASE_URL") (ne $value "") }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  NEXC_DATABASE_URL: {{ $v.NEXC_DATABASE_URL | default (printf "postgres://%s:%s@postgres:5432/%s" $v.POSTGRES_USER $v.POSTGRES_PASSWORD $v.POSTGRES_DB) | quote }}
{{- end }}
