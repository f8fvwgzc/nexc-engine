{{- if not .Values.secrets.existingSecret }}
{{- $v := .Values.secrets.values }}
{{- $required := list "POSTGRES_PASSWORD" "NEXC_JWT_SECRET" "NEXC_MASTER_KEY" "NEXC_RUNTIME_TOKEN" }}
{{- if .Values.ontoIntelli.enabled }}
{{- $required = concat $required (list "NEXC_ONTO_TOKEN" "ONTO_SESSION_SECRET") }}
{{- if .Values.postgres.enabled }}
{{- $required = append $required "ONTO_POSTGRES_PASSWORD" }}
{{- end }}
{{- end }}
{{- if index $v "NEXC_AGENT_TOKEN_KEY" }}
{{- fail "secrets.values.NEXC_AGENT_TOKEN_KEY is no longer read: agent tokens are signed with Ed25519 by the backend alone (NEXC_AGENT_TOKEN_SIGNING_KEY, derived from NEXC_MASTER_KEY when empty). Remove it; see the upgrade note in CHANGELOG.md" }}
{{- end }}
{{- range $key := $required }}
{{- if not (index $v $key) }}
{{- fail (printf "secrets.values.%s is empty: set it, or point secrets.existingSecret at a Secret made from deploy/k8s/secret.env (scripts/init-env.sh --k8s)" $key) }}
{{- end }}
{{- end }}
# The secrets every service reads: generated by scripts/init-env.sh --k8s, or given as values.
apiVersion: v1
kind: Secret
metadata:
  name: nexc-secrets
  labels:
    {{- include "nexc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $v }}
  {{- if and (ne $key "NEXC_DATABASE_URL") (ne $value "") }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  NEXC_DATABASE_URL: {{ $v.NEXC_DATABASE_URL | default (printf "postgres://%s:%s@postgres:5432/%s" $v.POSTGRES_USER $v.POSTGRES_PASSWORD $v.POSTGRES_DB) | quote }}
{{- end }}
