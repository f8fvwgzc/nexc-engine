# Backend API + scheduler. Stateless apart from the artifact volume; realtime fan-out between
# replicas goes through PostgreSQL LISTEN/NOTIFY, so it scales horizontally.
{{- if not .Values.backend.dataExistingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  labels:
    app.kubernetes.io/name: backend
    {{- include "nexc.labels" . | nindent 4 }}
spec:
  # ReadWriteOnce attaches to one node, so the Deployment keeps every backend pod on it; with
  # ReadWriteMany (backend.dataAccessMode) the pods spread across nodes.
  accessModes: [{{ .Values.backend.dataAccessMode }}]
  {{- with .Values.backend.dataStorageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.dataStorage }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    {{- include "nexc.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - name: http
      port: 8080
      targetPort: http
    # The agent-token key set alone (NEXC_KEYS_ADDR): what the runtime may reach, never the API.
    - name: keys
      port: 8081
      targetPort: keys
    {{- if .Values.backend.grpcAddr }}
    # The Agent Firewall API, for the agent platforms that sit behind nexc (CONTRACT §8).
    - name: firewall
      port: {{ .Values.backend.firewall.port }}
      targetPort: firewall
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    {{- include "nexc.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.backend.enabled }}
  replicas: {{ .Values.replicas.backend }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend, app.kubernetes.io/component: api }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # On SIGTERM the backend drains: readiness fails, its runs go to its peers (their trace
      # written, their lease released), then HTTP requests in flight finish (docs/HA.md).
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "nexc.podSecurity" (dict "uid" 10001 "fsGroup" true) | nindent 8 }}
      {{- if eq .Values.backend.dataAccessMode "ReadWriteOnce" }}
      # Every backend pod on the node the others run on: the ReadWriteOnce data volume attaches to
      # one node, and a pod placed on another (the second replica, a rollout's new pod) would wait
      # on a Multi-Attach error and stall the rollout (backend.dataAccessMode, docs/HA.md).
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app.kubernetes.io/name: backend }
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: backend }
      {{- end }}
      # Migrations first, with no probe to stop them: an index built CONCURRENTLY on a large table
      # can outlast the startup probe, and a build killed half way leaves an invalid index that
      # keeps every later start out (docs/DATABASE.md). `serve` then finds nothing to do.
      initContainers:
        - name: migrate
          image: {{ include "nexc.image" (dict "image" .Values.images.backend "chart" .Chart) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["migrate"]
          {{- include "nexc.backendEnv" . | nindent 10 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "nexc.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: backend
          image: {{ include "nexc.image" (dict "image" .Values.images.backend "chart" .Chart) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
            - name: keys
              containerPort: 8081
            {{- if .Values.backend.grpcAddr }}
            - name: firewall
              containerPort: {{ .Values.backend.firewall.port }}
            {{- end }}
          {{- include "nexc.backendEnv" . | nindent 10 }}
          startupProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30 # the init container ran the migrations already
          livenessProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          # Drain-aware: /readyz answers 503 from the moment the pod is told to stop (and while
          # the database does not answer). A pod being deleted leaves the Service at once anyway;
          # three failures in a row keep a database that is slow for a moment (every replica
          # probes the same one) from taking every backend out of the Service together.
          readinessProbe:
            httpGet: { path: /api/v1/readyz, port: http }
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "nexc.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ .Values.backend.dataExistingClaim | default "backend-data" }} }
        - name: tmp
          emptyDir: {}
