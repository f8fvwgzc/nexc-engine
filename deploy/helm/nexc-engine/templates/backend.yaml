# Backend API + scheduler. Stateless apart from the artifact volume; realtime fan-out between
# replicas goes through PostgreSQL LISTEN/NOTIFY, so it scales horizontally.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  labels:
    app.kubernetes.io/name: backend
    {{- include "nexc.labels" . | nindent 4 }}
spec:
  # ReadWriteOnce works on single-node clusters. With several nodes and more than one replica,
  # use a ReadWriteMany storage class so every replica sees every artifact.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.backend.dataStorage }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    {{- include "nexc.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- if .Values.backend.grpcAddr }}
    # The Agent Firewall API, for the agent platforms that sit behind nexc (CONTRACT §8).
    - name: firewall
      port: {{ .Values.backend.firewall.port }}
      targetPort: firewall
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    {{- include "nexc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.backend }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend, app.kubernetes.io/component: api }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "nexc.podSecurity" (dict "uid" 10001 "fsGroup" true) | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: backend }
      containers:
        - name: backend
          image: {{ include "nexc.image" (dict "image" .Values.images.backend "chart" .Chart) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.backend.grpcAddr }}
            - name: firewall
              containerPort: {{ .Values.backend.firewall.port }}
            {{- end }}
          envFrom:
            - configMapRef: { name: nexc-config }
            - secretRef: { name: {{ include "nexc.secretName" . }} }
          startupProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30 # migrations run before the server listens
          livenessProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/v1/readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "nexc.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: backend-data }
        - name: tmp
          emptyDir: {}
