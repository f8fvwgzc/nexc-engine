# onto-intelli for nexc-engine: the one place the ontology lives (docs/ONTOLOGY.md). Every graph's
# execution vocabulary, the workspace projected as entities and links, the audit's facts, the
# schema with its proposals, and the UI the console embeds as its workspace map.
#
# Mounted by docker-compose.onto.yml at /etc/onto/onto-intelli.toml, next to the two schema files
# it extends (relative paths resolve against this file's folder). Edit `[ui] embed_origins` when
# the console is served from another origin than http://localhost:8080.

[engine]
# PostgreSQL in its own database (ONTO_DATABASE_URL) on nexc's PostgreSQL server, which needs
# pgvector 0.7 or newer. One tenant per nexc workspace (x-onto-tenant: ws_<id>), one schema each.
storage = "postgres"
tenancy = "multi"
# Read-your-writes across replicas: a vocabulary written through one is read back through any.
read_consistency = "strong"
# nexc names the workspace on every call (`{NEXC_ONTO_WORKSPACE_PREFIX}{workspace id}`).
default_workspace = "nexc"
ingest_queue = 4096

[engine.postgres]
url_env = "ONTO_DATABASE_URL"
tenant = "default"
schema_prefix = "onto_"
max_connections = 10
connect_timeout_secs = 10

[ontology]
schema = "builtin:enterprise"
# The graphs' node and relation types (ExecutionService), the audit's kinds and relations, and
# the workspace's own (cycles, and the links the projection states).
extend = ["builtin:nexc-execution", "nexc-audit.toml", "nexc-workspace.toml"]
schema_mode = "live"
strict = false

# Who may change the schema. nexc grants `schema_admin` and `approver` to a workspace's owners
# and admins, `member` to members, `viewer` to guests and `agent` to its assistant, which only
# proposes: agents never apply or approve, whatever else they hold.
[governance]
live_edits = true
apply_roles = ["schema_admin"]
approve_roles = ["approver"]
propose_roles = []
required_approvals = 1
allow_self_approval = false

[llm]
# mock answers offline and deterministically; set anthropic (ANTHROPIC_API_KEY) or an
# OpenAI-compatible endpoint for real explanations. The deterministic answers never use it.
provider = "mock"

[context]
token_budget = 1800

[cache]
enabled = true

[memory]
enabled = false

[grpc]
listen = "0.0.0.0:50051"
builtin_api = true
reflection = true
health = true
http = true
proto_files = []

[auth]
mode = "token"
# Browser sessions (POST /v1/auth/session) are signed with ONTO_SESSION_SECRET, the same on
# every replica (scripts/init-env.sh generates it).
session_secret_env = "ONTO_SESSION_SECRET"
session_max_ttl_secs = 43200

# The backend presents NEXC_ONTO_TOKEN. On its own it is the service that writes what nexc knows
# (the projection, the audit's facts, a graph's first vocabulary), restricted entities included.
# Every call made for someone names them (x-onto-act-*), with roles from this list only: never
# admin.
[[auth.tokens]]
token_env = "NEXC_ONTO_TOKEN"
principal = { id = "nexc-backend", roles = ["admin"], workspaces = ["*"] }
impersonate = true
impersonate_roles = ["viewer", "member", "agent", "approver", "schema_admin"]
tenants = ["*"]

[mcp]
principal = { id = "mcp-agent", roles = ["agent"], workspaces = ["*"] }

[ui]
enabled = true
# The console's origins: CSP frame-ancestors, and who may hand the UI a session.
embed_origins = ["http://localhost:8080", "http://127.0.0.1:8080"]
title = "Ontology"
