# Backend API + scheduler. Stateless apart from the artifact volume; realtime fan-out between
# replicas goes through PostgreSQL LISTEN/NOTIFY, so it scales horizontally.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  labels: { app.kubernetes.io/name: backend }
spec:
  # ReadWriteOnce attaches the volume to one node, so the Deployment below keeps every backend
  # pod on one node. For replicas on several nodes (surviving the loss of one), use a
  # ReadWriteMany storage class (NFS, EFS, Filestore, CephFS) and swap the pod affinity below for
  # the topology spread it describes.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - name: http
      port: 8080
      targetPort: http
    # The agent-token key set alone (NEXC_KEYS_ADDR): what the runtime may reach, never the API.
    - name: keys
      port: 8081
      targetPort: keys
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend, app.kubernetes.io/component: api }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      # Every backend pod on the node the others run on: the ReadWriteOnce data volume attaches to
      # one node, and a pod placed on another (the second replica, a rollout's new pod) would wait
      # on a Multi-Attach error and stall the rollout. The replicas still cover a crash and a
      # rolling update, not the loss of the node; a drain of it waits on the PodDisruptionBudget
      # until the last pod is deleted (docs/HA.md). With a ReadWriteMany volume, spread them
      # instead:
      #   topologySpreadConstraints:
      #     - maxSkew: 1
      #       topologyKey: kubernetes.io/hostname
      #       whenUnsatisfiable: ScheduleAnyway
      #       labelSelector:
      #         matchLabels: { app.kubernetes.io/name: backend }
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app.kubernetes.io/name: backend }
      # Migrations first, with no probe to stop them: an index built CONCURRENTLY on a large
      # table can outlast the startup probe, and a build killed half way leaves an invalid index
      # that keeps every later start out (docs/DATABASE.md). `serve` then finds nothing to do.
      initContainers:
        - name: migrate
          image: ghcr.io/f8fvwgzc/nexc-engine-backend
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: nexc-config }
            - secretRef: { name: nexc-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: backend
          image: ghcr.io/f8fvwgzc/nexc-engine-backend
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
            - name: keys
              containerPort: 8081
          envFrom:
            - configMapRef: { name: nexc-config }
            - secretRef: { name: nexc-secrets }
          startupProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30 # the init container ran the migrations already
          livenessProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          # Drain-aware: 503 from the moment the pod is told to stop, while it hands its runs to
          # the other replicas (docs/HA.md). Three failures in a row: a database slow for a moment
          # does not take every replica out of the Service at once.
          readinessProbe:
            httpGet: { path: /api/v1/readyz, port: http }
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: backend-data }
        - name: tmp
          emptyDir: {}
