# Python agent runtime: internal only (NetworkPolicy admits the backend alone, and lets it reach
# only the backend's key-set port and runtime-egress; no DNS). Apply the Services before it starts
# (kubectl apply -k does): its peers' addresses come from their Services' environment variables.
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  labels: { app.kubernetes.io/name: agent-runtime }
spec:
  selector: { app.kubernetes.io/name: agent-runtime }
  ports:
    - name: http
      port: 8090
      targetPort: http
    # The gRPC stream the backend speaks (AgentRuntime/Execute); admitted from the backend only.
    - name: grpc
      port: 8095
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  labels: { app.kubernetes.io/name: agent-runtime, app.kubernetes.io/component: agents }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: agent-runtime }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agent-runtime, app.kubernetes.io/component: agents }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent-runtime
          image: ghcr.io/f8fvwgzc/nexc-engine-runtime
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
            - name: grpc
              containerPort: 8095
          # Only what the runtime needs: no database, JWT or master-key secrets.
          env:
            - name: NEXC_RUNTIME_TOKEN
              valueFrom: { secretKeyRef: { name: nexc-secrets, key: NEXC_RUNTIME_TOKEN } }
            # The runtime may not ask DNS (a lookup is a way out), so it reaches its two peers by the
            # addresses Kubernetes puts in every pod's environment for the Services that exist.
            # The backend alone signs the per-run agent tokens (Ed25519): the runtime fetches its
            # public keys from the backend's key-set port, by the key id a token names.
            - name: NEXC_AGENT_TOKEN_JWKS_URL
              value: "http://$(BACKEND_SERVICE_HOST):8081/api/v1/agent-tokens/jwks.json"
            # Out through runtime-egress alone: the NetworkPolicy allows nothing else.
            - name: HTTPS_PROXY
              value: "http://$(RUNTIME_EGRESS_SERVICE_HOST):3128"
            - name: HTTP_PROXY
              value: "http://$(RUNTIME_EGRESS_SERVICE_HOST):3128"
            - name: NO_PROXY
              value: "localhost,127.0.0.1"
            - name: NEXC_LLM_MODEL
              valueFrom: { configMapKeyRef: { name: nexc-config, key: NEXC_LLM_MODEL } }
            - name: RUNTIME_HOST
              valueFrom: { configMapKeyRef: { name: nexc-config, key: RUNTIME_HOST } }
            - name: RUNTIME_PORT
              valueFrom: { configMapKeyRef: { name: nexc-config, key: RUNTIME_PORT } }
            - name: RUNTIME_GRPC_PORT
              valueFrom: { configMapKeyRef: { name: nexc-config, key: RUNTIME_GRPC_PORT } }
            - name: RUNTIME_WORKSPACE
              valueFrom: { configMapKeyRef: { name: nexc-config, key: RUNTIME_WORKSPACE } }
            - name: RUNTIME_ALLOW_CODE_EXEC
              valueFrom: { configMapKeyRef: { name: nexc-config, key: RUNTIME_ALLOW_CODE_EXEC } }
            - name: RUNTIME_LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: nexc-config, key: RUNTIME_LOG_LEVEL } }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi, ephemeral-storage: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: workspace
          emptyDir: { sizeLimit: 1Gi }
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
