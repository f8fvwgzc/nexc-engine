# Keep at least one replica of each stateless tier during voluntary disruptions (node drains).
# The backend runs one replica on its ReadWriteOnce volume: one pod at a time may go, so a drain
# moves it (and with more replicas on ReadWriteMany, the others stay).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-runtime
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: agent-runtime }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runtime-egress
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: runtime-egress }
