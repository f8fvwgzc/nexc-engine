# The change-impact engine (https://github.com/f8fvwgzc/assessment-engine): the backend assesses
# every change to an issue or a project over gRPC (`Assess`, stateless: the versions and pins stay
# in PostgreSQL), so the engine stores nothing and scales like any stateless tier. Internal only:
# NetworkPolicy admits the backend alone on 50061 and lets the engine reach nothing.
# An engine that is down fails no edit: the change saves unassessed and its version stays.
apiVersion: v1
kind: Service
metadata:
  name: assessment-engine
  labels: { app.kubernetes.io/name: assessment-engine }
spec:
  selector: { app.kubernetes.io/name: assessment-engine }
  ports:
    - name: grpc
      port: 50061
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-engine
  labels: { app.kubernetes.io/name: assessment-engine, app.kubernetes.io/component: impact }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: assessment-engine }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: assessment-engine, app.kubernetes.io/component: impact }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: assessment-engine
          # The release the backend's client is built against (backend/Cargo.toml, the same tag).
          image: ghcr.io/f8fvwgzc/assessment-engine:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50061
          env:
            - name: ASSESSMENT_ADDR
              value: "0.0.0.0:50061"
            - name: ASSESSMENT_LOG_FORMAT
              value: json
            # Required of every call (health and reflection stay open); the backend sends the same
            # NEXC_ASSESSMENT_TOKEN. Optional: an empty token requires none.
            - name: ASSESSMENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: nexc-secrets, key: NEXC_ASSESSMENT_TOKEN, optional: true }
          # grpc.health.v1, asked by the engine's own binary (the image has no grpc_health_probe).
          livenessProbe:
            exec: { command: [assessment-engine, health] }
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec: { command: [assessment-engine, health] }
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi, ephemeral-storage: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
